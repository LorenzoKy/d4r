name: Build Windows RX 9060 XT release test

on:
  push:
    branches: [windows]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-rx9060xt-release-test
  cancel-in-progress: true

jobs:
  release-test:
    runs-on: windows-latest
    steps:
      - name: Checkout Windows branch
        uses: actions/checkout@v4
        with:
          ref: windows
          submodules: recursive

      - name: Prepare Windows build tools
        shell: pwsh
        run: .\scripts\windows\setup-windows-tools.ps1 -RuntimeProfile therock

      - name: Check gfx1200 K LDS bank model
        shell: pwsh
        run: |
          python .\kernels\tools\check_k_lds_banks.py

      - name: Build gfx1200 compile gate
        shell: pwsh
        run: |
          .\scripts\windows\build-windows-rdna4.ps1 `
            -RuntimeProfile therock `
            -GpuArch gfx1200 `
            -BuildDirectory "$PWD\build\windows-gfx1200" `
            -InstallDirectory "$PWD\dist\windows-gfx1200"

      - name: Validate gfx1200 K code objects
        shell: pwsh
        run: |
          $root="$PWD\dist\windows-gfx1200\experimental\k"
          $layers=@("enc0","enc1","enc2","enc3","enc4","dec5","dec4","dec3","dec2","dec1","dec0")
          foreach ($layer in $layers) {
            $path=Join-Path $root ("dltss_pwin_{0}_layer_gfx1200.hsaco" -f $layer)
            if (!(Test-Path -LiteralPath $path)) { throw "Missing K object: $path" }
            $bytes=[IO.File]::ReadAllBytes($path)
            if ($bytes.Length -le 4096) { throw "Suspicious/empty K object: $path ($($bytes.Length) bytes)" }
            $text=[Text.Encoding]::ASCII.GetString($bytes)
            if (!$text.Contains(("dltss_pwin_{0}_layer" -f $layer)) -or !$text.Contains(("dltss_pwin_{0}_layer_prep" -f $layer))) {
              throw "K object has no exported kernel/prep symbols: $path"
            }
            if (!$text.Contains("amdgpu12.00-amd-amdhsa-unknown-gfx1200")) {
              throw "K object target metadata is not gfx1200: $path"
            }
          }
          Write-Host "PASS gfx1200: all 11 K objects contain kernel+prep symbols and gfx1200 metadata."

      - name: Upload gfx1200 compile artifact
        uses: actions/upload-artifact@v4
        with:
          name: d4r-windows-gfx1200-k-compile
          path: |
            dist/windows-gfx1200/**
            build/windows-gfx1200/*.log
          if-no-files-found: error
          retention-days: 14

      - name: Check local DLSS test input
        id: dlss
        shell: pwsh
        env:
          D4R_DLSS_DLL_B64: ${{ secrets.D4R_DLSS_DLL_B64 }}
        run: |
          if (-not $env:D4R_DLSS_DLL_B64) {
            "available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "D4R_DLSS_DLL_B64 is not configured. Compile gate passed; release packaging is skipped."
            exit 0
          }
          $bytes=[Convert]::FromBase64String($env:D4R_DLSS_DLL_B64)
          [IO.File]::WriteAllBytes("$PWD\nvngx_dlss.dll",$bytes)
          $hash=(Get-FileHash "$PWD\nvngx_dlss.dll" -Algorithm SHA256).Hash
          Write-Host "DLSS input SHA256: $hash"
          if ($hash -ne "3975567b8943c53acce397f2b72380092f84f162d00b0d2c7d08a1025c563983") { throw "Unexpected DLSS 310.9.1 SHA256." }
          "available=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build all Windows GPU targets and game packages
        if: steps.dlss.outputs.available == 'true'
        shell: pwsh
        run: |
          .\scripts\windows\build-windows-gpu-matrix.ps1 `
            -RuntimeProfile therock `
            -GpuArchitectures @("gfx1100","gfx1101","gfx1102","gfx1103","gfx1150","gfx1151","gfx1152","gfx1153","gfx1154","gfx1200","gfx1201") `
            -ZludaRoot "$PWD\dist\zluda-windows-final" `
            -DlssDll "$PWD\nvngx_dlss.dll" `
            -PackageGames `
            -BuildRoot "$PWD\build\windows-gpu-coverage" `
            -OutputRoot "$PWD\dist\windows-gpu-coverage"

      - name: Build compact quick-test runtime ZIP
        if: steps.dlss.outputs.available == 'true'
        shell: pwsh
        run: |
          $out="$PWD\dist\release-test"
          $pkg="$out\package"
          $zip="$out\d4r-windows-quick-test.zip"
          New-Item -ItemType Directory -Force $out | Out-Null
          .\scripts\windows\package-windows-quick-test.ps1 `
            -GamePackagePrefix "$PWD\dist\windows-gpu-coverage-game" `
            -PackageRoot $pkg `
            -ArchivePath $zip
          if ((Get-Item $zip).Length -lt 121092482) {
            throw "Release test ZIP is smaller than the 2026-10-02 issue10 reference (121092482 bytes)."
          }
          (Get-FileHash $zip -Algorithm SHA256).Hash | Set-Content "$zip.sha256" -Encoding ASCII
          Write-Host "Release test ZIP: $zip"
          Write-Host "Bytes: $((Get-Item $zip).Length)"

      - name: Build corresponding-source ZIP
        if: steps.dlss.outputs.available == 'true'
        shell: pwsh
        run: |
          python .\tools\windows\package_quick_test_sources.py --output "$PWD\dist\release-test\d4r-windows-quick-test-sources.zip"
          (Get-FileHash "$PWD\dist\release-test\d4r-windows-quick-test-sources.zip" -Algorithm SHA256).Hash | Set-Content "$PWD\dist\release-test\d4r-windows-quick-test-sources.zip.sha256" -Encoding ASCII

      - name: Publish prerelease
        if: steps.dlss.outputs.available == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag="windows-quick-test-$((Get-Date).ToUniversalTime().ToString('yyyyMMdd-HHmmss'))-${{ github.run_number }}"
          gh release create $tag `
            "dist/release-test/d4r-windows-quick-test.zip" `
            "dist/release-test/d4r-windows-quick-test.zip.sha256" `
            "dist/release-test/d4r-windows-quick-test-sources.zip" `
            "dist/release-test/d4r-windows-quick-test-sources.zip.sha256" `
            --prerelease `
            --title "Windows RX 9060 XT quick-test release $tag" `
            --notes "Automated Windows release test from branch windows. Runtime ZIP is required to be at least 121,092,482 bytes, matching or exceeding the 2026-10-02 issue10 quick-test reference. NVIDIA DLLs are supplied only to CI as a secret and are not published."
