name: Build Windows RX 9060 XT release test (manual-ready)

on:
  push:
    branches: [windows]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-rx9060xt-release-test
  cancel-in-progress: true

jobs:
  release-test:
    runs-on: windows-latest
    steps:
      - name: Checkout Windows branch
        uses: actions/checkout@v4
        with:
          ref: windows
          submodules: recursive

      - name: Prepare Windows build tools
        shell: pwsh
        run: .\scripts\windows\setup-windows-tools.ps1 -RuntimeProfile therock

      - name: Check gfx1200 K LDS bank model
        shell: pwsh
        run: |
          python .\kernels\tools\check_k_lds_banks.py

      - name: Build gfx1200 compile gate
        shell: pwsh
        run: |
          .\scripts\windows\build-windows-rdna4.ps1 `
            -RuntimeProfile therock `
            -GpuArch gfx1200 `
            -BuildDirectory "$PWD\build\windows-gfx1200" `
            -InstallDirectory "$PWD\dist\windows-gfx1200"

      - name: Validate gfx1200 K code objects
        shell: pwsh
        run: |
          $root="$PWD\dist\windows-gfx1200\experimental\k"
          $layers=@("enc0","enc1","enc2","enc3","enc4","dec5","dec4","dec3","dec2","dec1","dec0")
          foreach ($layer in $layers) {
            $path=Join-Path $root ("dltss_pwin_{0}_layer_gfx1200.hsaco" -f $layer)
            if (!(Test-Path -LiteralPath $path)) { throw "Missing K object: $path" }
            $bytes=[IO.File]::ReadAllBytes($path)
            if ($bytes.Length -le 4096) { throw "Suspicious/empty K object: $path ($($bytes.Length) bytes)" }
            $text=[Text.Encoding]::ASCII.GetString($bytes)
            if (!$text.Contains(("dltss_pwin_{0}_layer" -f $layer)) -or !$text.Contains(("dltss_pwin_{0}_layer_prep" -f $layer))) {
              throw "K object has no exported kernel/prep symbols: $path"
            }
            if (!$text.Contains("amdgpu12.00-amd-amdhsa-unknown-gfx1200")) {
              throw "K object target metadata is not gfx1200: $path"
            }
          }
          Write-Host "PASS gfx1200: all 11 K objects contain kernel+prep symbols and gfx1200 metadata."

      - name: Upload gfx1200 compile artifact
        uses: actions/upload-artifact@v4
        with:
          name: d4r-windows-gfx1200-k-compile
          path: |
            dist/windows-gfx1200/**
            build/windows-gfx1200/*.log
          if-no-files-found: error
          retention-days: 14

      - name: Build RX 9060 XT quick-test package from issue10 base
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root="$PWD"
          $out="$root\dist\quick-test-gfx1200"
          $base="$out\base"
          $zip="$out\d4r-windows-quick-test-gfx1200.zip"
          New-Item -ItemType Directory -Force $out | Out-Null
          $baseZip="$out\issue10.zip"
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/xdfnx-dev/d4r/releases/download/windows-quick-test-20261002-issue10/d4r-windows-quick-test.zip" -OutFile $baseZip
          if ((Get-Item $baseZip).Length -ne 121092482) { throw "Unexpected issue10 base size." }
          $baseHash=(Get-FileHash $baseZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($baseHash -ne "72b9d7ee1815f7fccf409f4d234770d8cc1eea7061b596689ac67ef09b23e2d3") { throw "Unexpected issue10 base SHA256: $baseHash" }
          Add-Type -AssemblyName System.IO.Compression,System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($baseZip,$base)
          $currentK=Join-Path $root "dist\windows-gfx1200\experimental\k"
          $targetK=Join-Path $base 'files\targets\gfx1200\d4r\native'
          if (!(Test-Path -LiteralPath $targetK)) { throw 'Base quick-test gfx1200 native kernel directory is missing.' }
          foreach ($src in Get-ChildItem $currentK -Filter 'dltss_pwin_*_layer_gfx1200.hsaco') {
            if ($src.Name -notmatch '^dltss_pwin_(.+)_layer_gfx1200\.hsaco$') { throw "Unexpected K object name: $($src.Name)" }
            $layer=$Matches[1]
            $dest=Get-ChildItem $targetK -File -Filter ("dltss_pwin_"+$layer+"_layer*.hsaco") | Select-Object -First 1
            if (!$dest) { throw "Base quick-test has no gfx1200 K object for $layer" }
            Copy-Item $src.FullName $dest.FullName -Force
          }
          $bin=Join-Path $root "dist\windows-gfx1200\bin"
          $commonShim=Join-Path $bin 'd4r_nvngx.dll'
          if (!(Test-Path -LiteralPath $commonShim)) { throw "Current gfx1200 overlay is missing: $commonShim" }
          $targetShim=Join-Path $base 'files\targets\gfx1200\d4r\nvngx.dll'
          New-Item -ItemType Directory -Force (Split-Path $targetShim) | Out-Null
          Copy-Item $commonShim $targetShim -Force
          $targetOverlay=@(
            @{src=(Join-Path $bin 'd4r_gpu_inventory.exe'); rel='files\targets\gfx1200\d4r\d4r_gpu_inventory.exe'},
            @{src=(Join-Path $bin 'd4r_debug_launcher.exe'); rel='files\targets\gfx1200\d4r\d4r_debug_launcher.exe'},
            @{src=(Join-Path $root 'dist\windows-gfx1200\gpu-target.json'); rel='files\targets\gfx1200\gpu-target.json'},
            @{src=(Join-Path $bin 'pixel_convert_gfx1200.hsaco'); rel='files\targets\gfx1200\d4r\pixel_convert_gfx1200.hsaco'}
          )
          foreach ($item in $targetOverlay) {
            if (!(Test-Path -LiteralPath $item.src)) { throw "Current gfx1200 overlay is missing: $($item.src)" }
            $dest=Join-Path $base $item.rel
            if (!(Test-Path -LiteralPath $dest)) { throw "Base quick-test has no expected gfx1200 overlay target $($item.rel)" }
            Copy-Item $item.src $dest -Force
          }
          Copy-Item (Join-Path $root 'scripts\windows\quick-test.ps1') (Join-Path $base 'files\quick-test.ps1') -Force
          foreach ($name in @('windows-game.ps1','game-summary.ps1','gpu-target.ps1','gpu-preflight.ps1')) {
            Copy-Item (Join-Path $root "scripts\windows\$name") (Join-Path $base "files\common\$name") -Force
          }
          Copy-Item (Join-Path $root 'tools\windows\gpu-targets.json') (Join-Path $base 'files\common\gpu-targets.json') -Force
          Copy-Item (Join-Path $root 'docs\windows-quick-test.txt') (Join-Path $base 'READ-ME-FIRST.txt') -Force
          $manifestPath=Join-Path $base 'files\package.json'
          $manifest=Get-Content $manifestPath -Raw | ConvertFrom-Json
          $targetEntries=@($manifest.targets.gfx1200.files)
          if (!(@($targetEntries | Where-Object { $_.path.Replace('/','\') -eq 'd4r\nvngx.dll' }).Count)) {
            $manifest.targets.gfx1200.files=@($targetEntries)+[pscustomobject]@{path='d4r/nvngx.dll';sha256='';version=$null}
          }
          foreach ($entry in @($manifest.files)) {
            $rel=$entry.path.Replace('/','\')
            $full=Join-Path $base $rel
            if (!(Test-Path -LiteralPath $full)) { throw "Manifest file missing: $($entry.path)" }
            $entry.sha256=(Get-FileHash -LiteralPath $full -Algorithm SHA256).Hash
          }
          foreach ($entry in @($manifest.commonFiles)) {
            $full=Join-Path $base ('files\common\'+$entry.path.Replace('/','\'))
            if (Test-Path -LiteralPath $full) { $entry.sha256=(Get-FileHash -LiteralPath $full -Algorithm SHA256).Hash }
          }
          foreach ($targetProp in $manifest.targets.PSObject.Properties) {
            foreach ($entry in @($targetProp.Value.files)) {
              $full=Join-Path $base ('files\targets\'+$targetProp.Name+'\'+$entry.path.Replace('/','\'))
              if (Test-Path -LiteralPath $full) { $entry.sha256=(Get-FileHash -LiteralPath $full -Algorithm SHA256).Hash }
            }
          }
          $launchers=@(
            @{name='START-K-ASYNC.cmd'; arguments='-Preset 11 -AsyncInterop'},
            @{name='START-K-ASYNC-PROFILE.cmd'; arguments='-Preset 11 -AsyncInterop -ProfileStages -ProfileKernelsDeferred -ProfileLegacyStream -KernelProfileEvery 17'}
          )
          foreach ($launch in $launchers) {
            $path=Join-Path $base $launch.name
            $command='"%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -STA -ExecutionPolicy Bypass -File "%~dp0files\quick-test.ps1" ' + $launch.arguments
            @('@echo off','cd /d "%~dp0"',$command,'pause') | Set-Content -LiteralPath $path -Encoding ASCII
            $lines=@(Get-Content -LiteralPath $path)
            if ($lines.Count -ne 4 -or $lines[2] -ne $command) { throw "Invalid launcher generated: $($launch.name)" }
            $manifest.files=@($manifest.files)+[pscustomobject]@{path=$launch.name;sha256=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash;version=$null}
          }
          $currentCommit=(& git rev-parse HEAD).Trim()
          $manifest.packageCommit=$currentCommit
          $manifest.targets.gfx1200.binarySourceCommit=$currentCommit
          $manifest.targets.gfx1200.hardwareValidation='compile-only; RX 9060 XT user test pending'
          $manifest | ConvertTo-Json -Depth 20 | Set-Content $manifestPath -Encoding UTF8
          @{
            base='windows-quick-test-20261002-issue10'; baseSha256=$baseHash; baseBytes=121092482
            d4rCommit=$currentCommit; gfx1200KSource='dist/windows-gfx1200/experimental/k'; asyncLaunchers=@('START-K-ASYNC.cmd','START-K-ASYNC-PROFILE.cmd')
            note='Current windows-branch gfx1200 shim/diagnostics and 11 K objects overlaid on the validated issue10 quick-test runtime. NVIDIA DLLs remain excluded; tester supplies local originals.'
          } | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $base 'BUILD-PROVENANCE.json') -Encoding UTF8
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          [IO.Compression.ZipFile]::CreateFromDirectory($base,$zip,[IO.Compression.CompressionLevel]::Optimal,$false)
          $bytes=(Get-Item $zip).Length
          if ($bytes -lt 121092482) { throw "Final quick-test ZIP is smaller than issue10: $bytes bytes" }
          (Get-FileHash $zip -Algorithm SHA256).Hash | Set-Content "$zip.sha256" -Encoding ASCII
          if (!(Test-Path (Join-Path $base 'START-K.cmd'))) { throw 'START-K.cmd missing from final package.' }
          Write-Host "FINAL QUICK TEST ZIP: $zip"
          Write-Host "FINAL QUICK TEST BYTES: $bytes"

      - name: Upload RX 9060 XT quick-test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: d4r-windows-quick-test-gfx1200-${{ github.sha }}
          path: |
            dist/quick-test-gfx1200/d4r-windows-quick-test-gfx1200.zip
            dist/quick-test-gfx1200/d4r-windows-quick-test-gfx1200.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Check local DLSS test input
        id: dlss
        shell: pwsh
        env:
          D4R_DLSS_DLL_B64: ${{ secrets.D4R_DLSS_DLL_B64 }}
        run: |
          if (-not $env:D4R_DLSS_DLL_B64) {
            "available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "D4R_DLSS_DLL_B64 is not configured. Compile gate passed; release packaging is skipped."
            exit 0
          }
          $bytes=[Convert]::FromBase64String($env:D4R_DLSS_DLL_B64)
          [IO.File]::WriteAllBytes("$PWD\nvngx_dlss.dll",$bytes)
          $hash=(Get-FileHash "$PWD\nvngx_dlss.dll" -Algorithm SHA256).Hash
          Write-Host "DLSS input SHA256: $hash"
          if ($hash -ne "3975567b8943c53acce397f2b72380092f84f162d00b0d2c7d08a1025c563983") { throw "Unexpected DLSS 310.9.1 SHA256." }
          "available=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build all Windows GPU targets and game packages
        if: steps.dlss.outputs.available == 'true'
        shell: pwsh
        run: |
          .\scripts\windows\build-windows-gpu-matrix.ps1 `
            -RuntimeProfile therock `
            -GpuArchitectures @("gfx1100","gfx1101","gfx1102","gfx1103","gfx1150","gfx1151","gfx1152","gfx1153","gfx1154","gfx1200","gfx1201") `
            -ZludaRoot "$PWD\dist\zluda-windows-final" `
            -DlssDll "$PWD\nvngx_dlss.dll" `
            -PackageGames `
            -BuildRoot "$PWD\build\windows-gpu-coverage" `
            -OutputRoot "$PWD\dist\windows-gpu-coverage"

      - name: Build compact quick-test runtime ZIP
        if: steps.dlss.outputs.available == 'true'
        shell: pwsh
        run: |
          $out="$PWD\dist\release-test"
          $pkg="$out\package"
          $zip="$out\d4r-windows-quick-test.zip"
          New-Item -ItemType Directory -Force $out | Out-Null
          .\scripts\windows\package-windows-quick-test.ps1 `
            -GamePackagePrefix "$PWD\dist\windows-gpu-coverage-game" `
            -PackageRoot $pkg `
            -ArchivePath $zip
          if ((Get-Item $zip).Length -lt 121092482) {
            throw "Release test ZIP is smaller than the 2026-10-02 issue10 reference (121092482 bytes)."
          }
          (Get-FileHash $zip -Algorithm SHA256).Hash | Set-Content "$zip.sha256" -Encoding ASCII
          Write-Host "Release test ZIP: $zip"
          Write-Host "Bytes: $((Get-Item $zip).Length)"

      - name: Build corresponding-source ZIP
        if: steps.dlss.outputs.available == 'true'
        shell: pwsh
        run: |
          python .\tools\windows\package_quick_test_sources.py --output "$PWD\dist\release-test\d4r-windows-quick-test-sources.zip"
          (Get-FileHash "$PWD\dist\release-test\d4r-windows-quick-test-sources.zip" -Algorithm SHA256).Hash | Set-Content "$PWD\dist\release-test\d4r-windows-quick-test-sources.zip.sha256" -Encoding ASCII

      - name: Publish prerelease
        if: steps.dlss.outputs.available == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag="windows-quick-test-$((Get-Date).ToUniversalTime().ToString('yyyyMMdd-HHmmss'))-${{ github.run_number }}"
          gh release create $tag `
            "dist/release-test/d4r-windows-quick-test.zip" `
            "dist/release-test/d4r-windows-quick-test.zip.sha256" `
            "dist/release-test/d4r-windows-quick-test-sources.zip" `
            "dist/release-test/d4r-windows-quick-test-sources.zip.sha256" `
            --prerelease `
            --title "Windows RX 9060 XT quick-test release $tag" `
            --notes "Automated Windows release test from branch windows. Runtime ZIP is required to be at least 121,092,482 bytes, matching or exceeding the 2026-10-02 issue10 quick-test reference. NVIDIA DLLs are supplied only to CI as a secret and are not published."
