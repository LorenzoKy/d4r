name: Package RX 9060 XT quick-test (current)

on:
  push:
    branches: [windows]
  workflow_dispatch:

permissions:
  contents: read

authorizations:
  contents: read

concurrency:
  group: windows-rx9060xt-release-test
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout Windows branch
        uses: actions/checkout@v4
        with:
          ref: windows
          submodules: recursive

      - name: Download validated gfx1200 build artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $root="$PWD"
          $work="$root\\dist\\quick-test-package-only"
          $artifact="$work\\gfx1200.zip"
          $extract="$work\\gfx1200"
          New-Item -ItemType Directory -Force $work | Out-Null
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'}
          Invoke-WebRequest -UseBasicParsing -Headers $headers -Uri 'https://api.github.com/repos/LorenzoKy/d4r/actions/artifacts/11260670981/zip' -OutFile $artifact
          Add-Type -AssemblyName System.IO.Compression,System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($artifact,$extract)
          $kdir=Join-Path $extract 'dist\\windows-gfx1200\\experimental\\k'
          if (!(Test-Path $kdir)) { throw 'Validated gfx1200 artifact does not contain the K objects.' }

      - name: Build RX 9060 XT quick-test ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root="$PWD"
          $work="$root\\dist\\quick-test-package-only"
          $base="$work\\issue10"
          $baseZip="$work\\issue10.zip"
          $artifactRoot=Join-Path $work 'gfx1200\\dist\\windows-gfx1200'
          $zip="$work\\d4r-windows-quick-test-gfx1200.zip"
          $baseSha='72b9d7ee1815f7fccf409f4d234770d8cc1eea7061b596689ac67ef09b23e2d3'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/xdfnx-dev/d4r/releases/download/windows-quick-test-20261002-issue10/d4r-windows-quick-test.zip' -OutFile $baseZip
          if ((Get-Item $baseZip).Length -ne 121092482) { throw 'Unexpected issue10 base size.' }
          if ((Get-FileHash $baseZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $baseSha) { throw 'Unexpected issue10 base SHA256.' }
          Add-Type -AssemblyName System.IO.Compression,System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($baseZip,$base)
          $targetK=Join-Path $base 'files\\targets\\gfx1200\\d4r\\native'
          if (!(Test-Path $targetK)) { throw 'Base quick-test gfx1200 native kernel directory is missing.' }
          foreach ($src in Get-ChildItem (Join-Path $artifactRoot 'experimental\\k') -Filter 'dltss_pwin_*_layer_gfx1200.hsaco') {
            if ($src.Name -notmatch '^dltss_pwin_(.+)_layer_gfx1200\\.hsaco$') { throw "Unexpected K object: $($src.Name)" }
            $layer=$Matches[1]
            $dest=Get-ChildItem $targetK -File -Filter ("dltss_pwin_"+$layer+"_layer*.hsaco") | Select-Object -First 1
            if (!$dest) { throw "Base quick-test has no gfx1200 K object for $layer" }
            Copy-Item $src.FullName $dest.FullName -Force
          }
          $commonShim=Join-Path $artifactRoot 'bin\\d4r_nvngx.dll'
          $commonCandidates=@(Get-ChildItem $base -Recurse -File -Filter 'nvngx.dll' | Where-Object { $_.FullName -match '\\files\\common\\' })
          if (!(Test-Path $commonShim) -or !$commonCandidates.Count) { throw 'Could not locate current shim or base common nvngx.dll.' }
          Copy-Item $commonShim $commonCandidates[0].FullName -Force
          $overlay=@(
            @{src=(Join-Path $artifactRoot 'bin\\d4r_gpu_inventory.exe'); rel='files\\targets\\gfx1200\\d4r\\d4r_gpu_inventory.exe'},
            @{src=(Join-Path $artifactRoot 'bin\\d4r_debug_launcher.exe'); rel='files\\targets\\gfx1200\\d4r\\d4r_debug_launcher.exe'},
            @{src=(Join-Path $artifactRoot 'gpu-target.json'); rel='files\\targets\\gfx1200\\gpu-target.json'},
            @{src=(Join-Path $artifactRoot 'bin\\pixel_convert_gfx1200.hsaco'); rel='files\\targets\\gfx1200\\d4r\\pixel_convert_gfx1200.hsaco'}
          )
          foreach ($item in $overlay) {
            if (!(Test-Path $item.src)) { throw "Missing current gfx1200 package file: $($item.src)" }
            $dest=Join-Path $base $item.rel
            if (!(Test-Path $dest)) { throw "Base quick-test target is missing: $($item.rel)" }
            Copy-Item $item.src $dest -Force
          }
          Copy-Item (Join-Path $root 'scripts\\windows\\quick-test.ps1') (Join-Path $base 'files\\quick-test.ps1') -Force
          foreach ($name in @('windows-game.ps1','game-summary.ps1','gpu-target.ps1','gpu-preflight.ps1')) {
            Copy-Item (Join-Path $root "scripts\\windows\\$name") (Join-Path $base "files\\common\\$name") -Force
          }
          Copy-Item (Join-Path $root 'tools\\windows\\gpu-targets.json') (Join-Path $base 'files\\common\\gpu-targets.json') -Force
          Copy-Item (Join-Path $root 'docs\\windows-quick-test.txt') (Join-Path $base 'READ-ME-FIRST.txt') -Force
          $manifestPath=Join-Path $base 'files\\package.json'
          $manifest=Get-Content $manifestPath -Raw | ConvertFrom-Json
          foreach ($entry in @($manifest.files)) {
            $rel=$entry.path.Replace('/','\\'); $full=Join-Path $base $rel
            if (!(Test-Path $full)) { throw "Manifest file missing: $($entry.path)" }
            $entry.sha256=(Get-FileHash $full -Algorithm SHA256).Hash
          }
          foreach ($entry in @($manifest.commonFiles)) {
            $full=Join-Path $base ('files\\common\\'+$entry.path.Replace('/','\\'))
            if (Test-Path $full) { $entry.sha256=(Get-FileHash $full -Algorithm SHA256).Hash }
          }
          foreach ($targetProp in $manifest.targets.PSObject.Properties) {
            foreach ($entry in @($targetProp.Value.files)) {
              $full=Join-Path $base ('files\\targets\\'+$targetProp.Name+'\\'+$entry.path.Replace('/','\\'))
              if (Test-Path $full) { $entry.sha256=(Get-FileHash $full -Algorithm SHA256).Hash }
            }
          }
          $currentCommit=(& git rev-parse HEAD).Trim()
          $manifest.packageCommit=$currentCommit
          $manifest.targets.gfx1200.binarySourceCommit='2bc120399b0f41d3fc05808788fce29d42384e6d'
          $manifest.targets.gfx1200.hardwareValidation='compile-only; RX 9060 XT user test pending'
          $manifest | ConvertTo-Json -Depth 20 | Set-Content $manifestPath -Encoding UTF8
          @{base='windows-quick-test-20261002-issue10';baseBytes=121092482;baseSha256=$baseSha;packageCommit=$currentCommit;binarySourceCommit='2bc120399b0f41d3fc05808788fce29d42384e6d';note='Current windows branch quick-test scripts plus validated current gfx1200 shim/K objects overlaid on the issue10 portable runtime. NVIDIA DLLs remain excluded.'} |
            ConvertTo-Json | Set-Content (Join-Path $base 'BUILD-PROVENANCE.json') -Encoding UTF8
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          [IO.Compression.ZipFile]::CreateFromDirectory($base,$zip,[IO.Compression.CompressionLevel]::Optimal,$false)
          $bytes=(Get-Item $zip).Length
          if ($bytes -lt 121092482) { throw "Final quick-test ZIP is smaller than issue10: $bytes bytes" }
          (Get-FileHash $zip -Algorithm SHA256).Hash | Set-Content "$zip.sha256" -Encoding ASCII
          if (!(Test-Path (Join-Path $base 'START-K.cmd'))) { throw 'START-K.cmd missing.' }
          Write-Host "FINAL QUICK TEST ZIP: $zip"
          Write-Host "FINAL QUICK TEST BYTES: $bytes"

      - name: Upload RX 9060 XT quick-test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: d4r-windows-quick-test-gfx1200-current
          path: |
            dist/quick-test-package-only/d4r-windows-quick-test-gfx1200.zip
            dist/quick-test-package-only/d4r-windows-quick-test-gfx1200.zip.sha256
          if-no-files-found: error
          retention-days: 14
